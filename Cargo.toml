[workspace]
members = ["."]

[package]
name = "msm_rtsp_stub"
version = "0.0.2-dev"
authors = ["Giles Heron <giles@4mc.partners>"]
description = "RTSP Sidecar Stub Proxy written in Rust"
homepage = "https://github.com/media-streaming-mesh/msm-rtsp-stub"
repository = "https://github.com/media-streaming-mesh/msm-rtsp-stub"
readme = "README.md"
keywords = ["RTSP"]
license = "Apache-2.0"
edition = "2021"

[profile.release]
lto = true

[dependencies]
# Crates.io
async-recursion = "1.1.1"
async-stream = "0.3.6"
bytes = "1.8.0"
clap = { version = "=4.5.40", features = ["derive"] }
futures = "0.3.31"
h2 = "0.4.7"
log = "0.4.25"
once_cell = "1.21.0"
prost = "0.13.5"
simple_logger = "5.0.0"
tokio = { version = "1.38.0", features = ["macros", "rt", "signal"] }
time = "=0.3.36"
tokio-util = "0.7.18"
tonic = "0.13.1"
void = "1.0.2"
envmnt = "0.10.4"
tempfile = "=3.27.0"

[build-dependencies]
tonic-build = { version = "0.13.1", default-features = false, features = ["transport", "prost"] }
prost-build = "0.13.5"
